name: dropin

on:
  push:
    paths:
      - 'dropin/**'
      - '.github/workflows/dropin.yml'
  pull_request:
    paths:
      - 'dropin/**'
      - '.github/workflows/dropin.yml'

jobs:
  build:
    name: build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: build
        run: mvn -B -f dropin/pom.xml install -DskipTests
      - name: java unit tests
        run: mvn -B -f dropin/pom.xml test
      - name: dotnet unit tests
        run: dotnet test dropin/clients/dotnet/PasClient.slnx

  parity:
    name: parity gate (expected to fail)
    runs-on: ubuntu-latest
    # Not a required check. The mirror is knowingly not at parity yet; this job
    # is how that stays visible on every commit instead of living in a doc.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: build
        run: mvn -B -f dropin/pom.xml install -DskipTests
      - name: parity
        run: make -C dropin parity-report
